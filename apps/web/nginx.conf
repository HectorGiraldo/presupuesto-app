# Sirve la SPA de Angular. La llamada a la API la hace el navegador
# directamente contra la URL de "api" (compilada en el bundle vía API_BASE_URL,
# ver api-base.ts), con CORS habilitado en el backend — nginx aquí no hace de
# proxy de nada, solo sirve ficheros estáticos.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Comprime la respuesta; el bundle de Angular se beneficia mucho de esto.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # Los assets con hash en el nombre (JS/CSS del build de producción) pueden
  # cachearse de forma agresiva porque cualquier cambio les cambia el nombre.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta que no sea un fichero real cae en index.html para que
  # el router de Angular la resuelva (recargar /transactions no debe dar 404).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
