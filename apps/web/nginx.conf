# Sirve la SPA de Angular y hace de proxy de /api hacia el contenedor de la API,
# todo bajo el MISMO origen. Así el navegador nunca hace una petición cross-origin
# y no hace falta configurar CORS ni pasarle al build la URL de la API.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Comprime la respuesta; el bundle de Angular se beneficia mucho de esto.
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  location /api/ {
    # "api" es el nombre del servicio en docker-compose / Coolify; resuelve por DNS interno.
    proxy_pass http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Los assets con hash en el nombre (JS/CSS del build de producción) pueden
  # cachearse de forma agresiva porque cualquier cambio les cambia el nombre.
  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: cualquier ruta que no sea un fichero real cae en index.html para que
  # el router de Angular la resuelva (recargar /transactions no debe dar 404).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
