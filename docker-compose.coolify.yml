# Variante de docker-compose.yml pensada para Coolify (o cualquier host donde
# Coolify/Traefik ya ocupe los puertos 80/443 del servidor).
#
# Diferencia clave con docker-compose.yml: aquí NINGÚN servicio publica un
# puerto al host con `ports:`. Coolify, cuando ve `ports: "host:contenedor"`
# en un servicio, lo enlaza literalmente en el servidor SALTÁNDOSE su propio
# proxy — eso rompería el proxy de Coolify (que ya usa el 80/443) y, en el
# caso de postgres, dejaría la base de datos expuesta a internet.
#
# En su lugar: `web` no publica nada (Coolify le asigna un dominio en su UI
# y su proxy interno llega al contenedor por la red que él mismo crea);
# `postgres` tampoco publica nada, porque solo lo necesita `api`, que lo
# alcanza por nombre de servicio dentro de esa misma red interna.
name: presupuesto-app

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-presupuesto}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-presupuesto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-presupuesto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-presupuesto}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      DB_NAME: ${DB_NAME:-presupuesto}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

volumes:
  postgres_data:
