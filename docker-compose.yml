# SOLO para desarrollo local / probar el stack completo en tu máquina.
# Coolify NO usa este archivo — allí cada servicio (Postgres gestionado, api,
# web) es un recurso independiente; ver la sección "Despliegue" del README.
#
# Aquí el navegador llama directo a la API en localhost:3000 (por eso "api"
# publica su puerto y tiene CORS_ORIGINS apuntando a donde sirve "web"): es
# el mismo modelo que en producción, solo que con dominios locales.
name: presupuesto-app

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-presupuesto}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-presupuesto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-presupuesto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-presupuesto}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      DB_NAME: ${DB_NAME:-presupuesto}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      CORS_ORIGINS: http://localhost

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_URL: http://localhost:3000/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
