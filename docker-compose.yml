name: presupuesto-app

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-presupuesto}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-presupuesto}
      POSTGRES_DB: ${DB_NAME:-presupuesto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-presupuesto}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # En local se expone el puerto para poder conectar con un cliente SQL;
    # en Coolify no hace falta publicarlo, la API le llega por la red interna.
    # Puerto de host configurable porque en la máquina de desarrollo ya hay
    # otros Postgres ocupando 5432/5433.
    ports:
      - "${DB_HOST_PORT:-5434}:5432"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-presupuesto}
      DB_PASSWORD: ${DB_PASSWORD:-presupuesto}
      DB_NAME: ${DB_NAME:-presupuesto}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # nginx sirve web y api bajo el mismo dominio -> no hace falta whitelistar orígenes.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  postgres_data:
