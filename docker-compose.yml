# Base del stack: postgres + api + web, SIN publicar ningún puerto al host.
# Esto es lo que se apunta tal cual en Coolify (u otro host donde un proxy ya
# ocupe el 80/443): si un servicio publicara un puerto con "host:contenedor",
# Coolify lo enlazaría literalmente en el servidor saltándose su propio proxy
# — reventaría ese proxy en el caso de "web", y dejaría la base de datos
# expuesta a internet en el caso de "postgres".
#
# Para desarrollo local, docker-compose.override.yml (que Docker Compose
# carga automáticamente junto a este) añade los puertos que hacen falta para
# poder abrir localhost en el navegador y conectar un cliente SQL. Ese
# override nunca se despliega en Coolify porque solo se le indica esta ruta.
name: presupuesto-app

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-presupuesto}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-presupuesto}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-presupuesto}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-presupuesto}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      DB_NAME: ${DB_NAME:-presupuesto}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      # nginx sirve web y api bajo el mismo dominio -> no hace falta whitelistar orígenes.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api

volumes:
  postgres_data:
